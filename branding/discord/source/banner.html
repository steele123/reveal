<!doctype html><html><head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:960px;height:540px;overflow:hidden;background:#070b14;font-family:Inter,"Segoe UI",sans-serif;color:#e8eef8}
.bg{position:absolute;inset:0;background:
  radial-gradient(600px 380px at 18% 22%,rgba(59,130,246,.38),transparent 70%),
  radial-gradient(520px 420px at 92% 95%,rgba(139,92,246,.22),transparent 70%),
  linear-gradient(160deg,#0b1428,#070b14 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(700px 500px at 25% 40%,#000,transparent 75%)}
.copy{position:absolute;left:64px;top:118px;width:400px}
.logo{width:76px;height:76px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(147,197,253,.35),0 12px 40px rgba(59,130,246,.45)}
.logo img{width:100%;height:100%}
h1{margin:28px 0 0;font-size:62px;line-height:1;font-weight:800;letter-spacing:-.03em}
h1 span{color:#60a5fa}
p{margin:18px 0 0;font-size:21px;line-height:1.45;color:#9fb0c8}
.chips{display:flex;gap:10px;margin-top:28px}
.chips div{padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600;color:#bfdbfe;background:rgba(59,130,246,.14);border:1px solid rgba(96,165,250,.3)}
.shot{position:absolute;left:520px;top:62px;width:520px;border-radius:16px;transform:perspective(1400px) rotateY(-16deg) rotateX(5deg) rotateZ(-1deg);transform-origin:left center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(148,163,184,.18),0 0 60px rgba(59,130,246,.25)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="copy">
  <div class="logo"><img src="icon.png"></div>
  <h1>Lobby <span>Reveal</span></h1>
  <p>See your teammates' names, ranks and mains in champ select.</p>
  <div class="chips"><div>Free</div><div>Open source</div><div>lobbyreveal.app</div></div>
</div>
<img class="shot" src="app-clean.png">
</body></html>
